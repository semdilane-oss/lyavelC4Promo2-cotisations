<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caisse C4">
<title>LYAVEL C4 PROMO2 – Caisse commune</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1f2a24;--mute:#6b766f;--acc:#1f7a4d;--acc2:#e0a82e;--line:#e3ded2;--chip:#efeae0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121815;--card:#1b241f;--ink:#eef2ee;--mute:#9aa8a0;--acc:#3fbf7f;--acc2:#e8b94a;--line:#2b3830;--chip:#26322b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:980px;margin:0 auto;padding:20px 14px 60px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{margin:0;font-size:1.5rem;letter-spacing:.5px}
.sub{color:var(--mute);font-size:.9rem;margin-top:2px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
.big{font-size:2rem;font-weight:700;color:var(--acc)}
.bar{height:12px;border-radius:8px;background:var(--chip);overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--mute);font-size:.85rem}
.banner{background:var(--chip);border:1px dashed var(--acc);border-radius:12px;padding:10px 12px;font-size:.88rem;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.top{display:flex;justify-content:space-between;align-items:baseline}
.name{font-weight:700;font-size:1.05rem}
.amt{color:var(--acc);font-weight:700}
svg{width:100%;height:70px;display:block;margin:8px 0}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--mute);border-radius:8px;padding:7px 0;font-size:.75rem;font-family:inherit}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chip:disabled{cursor:default}
button{font-family:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:.9rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:500;font-size:.8rem;padding:6px 10px}
.btn:disabled{opacity:.5}
footer{color:var(--mute);font-size:.78rem;text-align:center;margin-top:24px}
</style>
</head>
<body>
<main>
<div class="head">
 <div><h1>LYAVEL C4 PROMO2</h1>
 <div class="sub">Caisse commune · 2 000 FCFA par mois et par personne · octobre 2026 → septembre 2027</div></div>
 <button class="btn ghost" id="adm">Responsable</button>
</div>
<div id="app"><p class="sub">Chargement…</p></div>
<footer>Nos retrouvailles, et nous soutenir les uns les autres.<br>Version 3 · clé vérifiée</footer>
</main>
<script>
var MONTHS=["Oct","Nov","Déc","Janv","Févr","Mars","Avr","Mai","Juin","Juil","Août","Sept"];
var AMOUNT=2000, FILE="data.json";
var state=null, canEdit=false, dirty=false, msg="", busy=false;
var OWNER="semdilane-oss", REPO="lyavelC4Promo2-cotisations";
function tok(){try{return localStorage.getItem("lyavel_token")||""}catch(e){return ""}}
function paidOf(n){var p=state.paid[n];if(!p){p=state.paid[n]=MONTHS.map(function(){return 0})}return p}
function fmt(n){return n.toLocaleString("fr-FR").replace(/[\u202f\u00a0]/g," ")+" FCFA"}
function chart(p){
  var c=0,pts=["4,36"],i;
  for(i=0;i<12;i++){c+=p[i];pts.push((4+(i+1)*9.33).toFixed(1)+","+(36-c/12*32).toFixed(1))}
  var l=pts[pts.length-1].split(",");
  return '<svg viewBox="0 0 120 40" preserveAspectRatio="none" aria-hidden="true"><line x1="4" y1="36" x2="116" y2="36" stroke="var(--line)"/><line x1="4" y1="4" x2="116" y2="4" stroke="var(--line)" stroke-dasharray="2 2"/><polygon points="4,36 '+pts.join(" ")+' 116,36" fill="var(--acc)" opacity=".15"/><polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linejoin="round"/><circle cx="'+l[0]+'" cy="'+l[1]+'" r="2.2" fill="var(--acc2)"/></svg>';
}
function render(){
  if(!state)return;
  var total=0,goal=state.members.length*12*AMOUNT,cards="";
  state.members.forEach(function(n){
    var p=paidOf(n),k=p.reduce(function(a,b){return a+b},0);
    total+=k*AMOUNT;
    var chips=MONTHS.map(function(m,i){return '<button class="chip'+(p[i]?' on':'')+'" data-n="'+n+'" data-i="'+i+'"'+(canEdit?'':' disabled')+'>'+m+'</button>'}).join("");
    cards+='<div class="card"><div class="top"><span class="name">'+n+'</span><span class="amt">'+fmt(k*AMOUNT)+'</span></div>'+chart(p)+'<div class="row" style="margin-bottom:8px"><span>'+k+' / 12 mois</span><span>Reste '+fmt((12-k)*AMOUNT)+'</span></div><div class="chips">'+chips+'</div></div>';
  });
  var pct=goal?Math.round(total/goal*100):0, h="";
  if(canEdit)h+='<div class="banner"><span>'+(msg||"Mode responsable : touche les mois payés, puis enregistre.")+'</span><button class="btn" id="save"'+((dirty&&!busy)?'':' disabled')+'>Enregistrer</button></div>';
  h+='<div class="hero"><div class="sub">Total dans la caisse</div><div class="big">'+fmt(total)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="row"><span>'+pct+' % de l’objectif</span><span>Objectif de septembre : '+fmt(goal)+'</span></div></div><div class="grid">'+cards+'</div>';
  document.getElementById("app").innerHTML=h;
  document.getElementById("adm").textContent=canEdit?"Quitter":"Responsable";
}
function load(){
  return fetch(FILE+"?t="+Date.now()).then(function(r){return r.json()}).then(function(d){state=d;render()})
   .catch(function(){document.getElementById("app").innerHTML='<p class="sub">Impossible de charger les données.</p>'});
}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function save(){
  busy=true;msg="Enregistrement…";render();
  var url="https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+FILE;
  var H={"Authorization":"Bearer "+tok(),"Accept":"application/vnd.github+json"};
  fetch(url,{headers:H}).then(function(r){if(!r.ok)throw new Error("lecture");return r.json()}).then(function(f){
    return fetch(url,{method:"PUT",headers:H,body:JSON.stringify({message:"Mise à jour des cotisations",content:b64(JSON.stringify(state,null,1)),sha:f.sha})});
  }).then(function(r){if(!r.ok)throw new Error("écriture");dirty=false;busy=false;msg="Enregistré. Visible chez tous dans environ 1 minute.";render()})
  .catch(function(){busy=false;msg="Échec. Vérifie ton jeton (clé secrète) et ta connexion.";render()});
}
document.getElementById("app").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.id==="save"){save();return}
  if(b.classList.contains("chip")&&canEdit){var p=paidOf(b.dataset.n),i=+b.dataset.i;p[i]=p[i]?0:1;dirty=true;msg="";render()}
});
document.getElementById("adm").addEventListener("click",async function(){
  if(canEdit){canEdit=false;try{localStorage.removeItem("lyavel_token")}catch(e){}load();return}
  var t=tok()||prompt("Colle ici ta clé secrète de responsable :");
  if(!t)return;
  t=t.trim();
  try{
    var r=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO,{headers:{"Authorization":"Bearer "+t,"Accept":"application/vnd.github+json"}});
    if(!r.ok)throw new Error("code "+r.status);
    var d=await r.json();
    if(d.permissions&&d.permissions.push===false)throw new Error("pas de droit d’écriture");
    try{localStorage.setItem("lyavel_token",t)}catch(e){}
    canEdit=true;msg="";render();
  }catch(e){
    try{localStorage.removeItem("lyavel_token")}catch(x){}
    canEdit=false;render();
    alert("Clé refusée ("+e.message+"). Seul le responsable avec la bonne clé peut modifier.");
  }
});
load();
</script>
</body>
</html>
